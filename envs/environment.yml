name: scrna
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - matplotlib>=3.7
  - seaborn>=0.12
  - scikit-learn>=1.2
  - pip:
    - scanpy==1.11.5
    - anndata==0.11.4
    - harmonypy==0.0.9
    - leidenalg
    - umap-learn>=0.5
    - pydeseq2>=0.4
    - statsmodels>=0.14
    - adjustText
    - networkx
    - GEOparse
